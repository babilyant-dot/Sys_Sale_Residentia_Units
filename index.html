<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#dde1e7;--ln:#9aa3af;--sold:#0a2a8f;--avail:#39ff14;--build:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1c222b;--tx:#e8ecf2;--mut:#98a2b3;--bd:#323a46;--ln:#5b6572}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1c222b;--tx:#e8ecf2;--mut:#98a2b3;--bd:#323a46;--ln:#5b6572}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding:12px}
#show{position:fixed;inset:0;background:#0b1a33;z-index:9;display:none;cursor:pointer}#show.on{display:block}
.sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s;overflow:hidden}.sl.on{opacity:1}
.bgb{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.5)}
.sl>img:not(.lg){position:relative;max-width:100%;max-height:100%;object-fit:contain}.sl.on>img:not(.lg){animation:kb 8s linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.brandsl{flex-direction:column;gap:2vh;background:linear-gradient(135deg,#16468e,#0b2a5c);color:#fff;text-align:center}.brandsl .lg{height:32vh;width:auto}.brandsl h2{margin:0;font-size:clamp(28px,5vw,64px);color:#f3dcae}.brandsl p{margin:0;font-size:clamp(16px,2.4vw,32px);color:#cfdcf2}
.lgd{display:flex;gap:3vw;flex-wrap:wrap;justify-content:center;font-size:clamp(14px,2vw,26px)}.lgd span{display:flex;align-items:center;gap:8px}.lgd i{width:1.2em;height:1.2em;border-radius:4px;display:inline-block}
.hint{position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;padding:10px 22px;border-radius:30px;font-size:clamp(14px,2vw,24px);border:1px solid rgba(255,255,255,.4);z-index:2;white-space:nowrap}
.dots{position:absolute;top:3vh;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#dcb16d}
.tp{font-size:3px;fill:#fff;text-anchor:middle;pointer-events:none;display:none}.tp.dk{fill:#062006}svg.z .tp{display:block}body.view .tp{display:block;font-size:3.7px;font-weight:700}
.p.hd{stroke:#a855f7;stroke-width:1.5;stroke-dasharray:1 1}.p.pls{animation:pl 1s ease-in-out infinite;stroke:#fff;stroke-width:2}@keyframes pl{50%{fill-opacity:.3}}
#kpi{display:none}body.view #kpi{display:flex;gap:10px;margin-bottom:8px}#kpi div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;text-align:center}#kpi b{display:block;font-size:clamp(22px,3.4vw,44px);line-height:1.2}#kpi span{font-size:clamp(12px,1.5vw,20px);color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.kp div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.kp b{display:block;font-size:20px}.kp span{font-size:12px;color:var(--mut)}
.pb{display:flex;height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%}
.p{transition:fill .35s ease,fill-opacity .2s}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:6px}
.top button,.chip,button.x,button.s{transition:transform .15s,box-shadow .15s,background .15s}.top button:hover,.chip:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.14)}.top button:active,.chip:active,button.x:active{transform:scale(.97)}
#card{animation:pop .22s ease-out}@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}}
#card.wide{max-width:820px}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:8px}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px}.cd h4{margin:0 0 6px;font-size:13px;color:var(--mut)}
.cr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lgx{flex:1;min-width:130px;font-size:13px}
.lg2{display:flex;align-items:center;gap:6px;width:100%;margin:3px 0;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}.lg2 i{width:10px;height:10px;border-radius:3px;display:inline-block}.hnt{font-size:11px;color:var(--mut)}
.dsg{cursor:pointer;transition:stroke-width .2s}.dsg:hover{stroke-width:17}.rg{animation:rgrow 1s ease-out}@keyframes rgrow{from{stroke-dasharray:0 300}}
.cb{transform-box:fill-box;transform-origin:bottom;animation:grow .7s ease-out}@keyframes grow{from{transform:scaleY(0)}}

function parseXL(rows){

 if(!rows.length){out.innerHTML='<div class="note">الورقة فارغة.</div>';return}

 if(!map.id){out.innerHTML=`<div class="note">لم يُعثر على عمود "رقم الوحدة". الأعمدة الموجودة: ${Object.keys(rows[0]).join('، ')}</div>`;return}
 const err=[],seen=new Set();
 rows.forEach((r,i)=>{const L=i+2,g=f=>map[f]?r[map[f]]:'',id=toNum(g('id'));
  if(!P[id]){err.push(`سطر ${L}: رقم غير موجود (${g('id')})`);return}

function startShow(){if(showing)return;showing=true;buildShow();$('show').classList.add('on');go(0);stm=setInterval(()=>go(sidx+1),6000)}

async function sha(s){s=String(s);if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('esraa|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(let k=0;k<3000;k++)for(const c of 'esraa|'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}
