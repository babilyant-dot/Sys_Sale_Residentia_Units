.p{stroke:var(--card);stroke-width:.25;fill-opacity:.9;cursor:pointer}.p:hover{stroke:var(--tx);stroke-width:.8}

#card h2{margin:0 0 4px;font-size:18px}
.badge{display:inline-block;color:#fff;border-radius:6px;padding:2px 10px;font-size:12px;margin-bottom:10px}
.r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.r span:first-child{color:var(--mut)}
.sec{margin:12px 0 4px;font-weight:700;font-size:14px}
.note{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:8px;font-size:13px;color:var(--mut);margin-top:10px}
.f{display:block;margin-top:8px;font-size:13px;color:var(--mut)}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);box-sizing:border-box}
.f input,.f select{width:100%;margin-top:3px}

const fz=n=>Number(n||0).toLocaleString('en-US')+' د.ع',pd_=b=>(+b.p1||0)+(+b.p2||0)+(+b.p3||0)+(+b.p4||0),rem=u=>(u.price||0)-pd_(u.buyer);
const fm=n=>n?Number(n).toLocaleString('en-US')+' د.ع':'غير محدد';
const canEdit=u=>role==='admin'||(role==='sales'&&(u.status!=='sold'||(u.buyer&&u.buyer.agent===ME)));
$('bg').setAttribute('d',D.BG);
const g=$('pl');
Object.values(P).forEach(u=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',u.d);p.setAttribute('class','p');p.dataset.id=u.id;u.el=p;g.appendChild(p);
 const t=document.createElementNS(NS,'text');t.setAttribute('x',u.cx);t.setAttribute('y',u.cy+1.4);t.setAttribute('class','t');t.textContent=u.id;u.tl=t;g.appendChild(t)});
function paint(){Object.values(P).forEach(u=>{u.el.style.fill=ST[u.status].c;u.tl.setAttribute('class','t'+(u.status==='avail'?' dk':''));u.el.setAttribute('class','p'+(flt!=='all'&&flt!==u.status?' dim':''))});
 const c=s=>Object.values(P).filter(u=>u.status===s).length;
 $('bar').innerHTML=`<button class="chip ${flt==='all'?'on':''}" data-f="all">الكل (1531)</button>`+Object.keys(ST).map(s=>`<button class="chip ${flt===s?'on':''}" data-f="${s}"><span class="dot" style="background:${ST[s].c}"></span>${ST[s].t} (${c(s)})</button>`).join('');
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.f;paint()})}
/* pan & zoom */
const svg=$('map'),w0=$('mapw');let vb={x:D.VB[0],y:D.VB[1],w:D.VB[2],h:D.VB[3]};
function setvb(){const r=w0.getBoundingClientRect();vb.h=vb.w*r.height/r.width;svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);svg.classList.toggle('z',vb.w<420)}
function fit(){const r=w0.getBoundingClientRect(),k=Math.max(D.VB[2]/r.width,D.VB[3]/r.height);vb.w=r.width*k;vb.x=D.VB[0]+(D.VB[2]-vb.w)/2;vb.y=D.VB[1]+(D.VB[3]-r.height*k)/2;setvb()}
function zoom(f,cx,cy){const r=w0.getBoundingClientRect(),px=(cx-r.left)/r.width,py=(cy-r.top)/r.height;const nw=Math.min(Math.max(vb.w*f,40),D.VB[2]*1.5);const k=nw/vb.w;vb.x+=px*vb.w*(1-k);vb.y+=py*vb.h*(1-k);vb.w=nw;setvb()}
w0.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.15:.87,e.clientX,e.clientY)},{passive:false});
const ptr=new Map();let moved=0,pd=0;
w0.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=ptr.size>1?Math.hypot(...[...ptr.values()].reduce((a,b)=>[a[0]-b[0],a[1]-b[1]]))||0:0;w0.setPointerCapture(e.pointerId)});
w0.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),r=w0.getBoundingClientRect();
 if(ptr.size===1){const dx=e.clientX-o[0],dy=e.clientY-o[1];moved+=Math.abs(dx)+Math.abs(dy);vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.w/r.width;setvb()}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){zoom(pd/d,(a[0]+b[0])/2,(a[1]+b[1])/2)}pd=d;moved=99}});
const up=e=>{const was=ptr.size===1&&moved<8;ptr.delete(e.pointerId);if(was){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.dataset&&el.dataset.id)show(+el.dataset.id)}};
w0.addEventListener('pointerup',up);w0.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
window.addEventListener('resize',setvb);
/* cards */
function open_(h){$('card').innerHTML=h;$('ov').style.display='flex'}
function close(){$('ov').style.display='none'}
function show(id){const u=P[id],s=ST[u.status];
 let h=`<h2>القطعة ${u.id}</h2><span class="badge" style="background:${s.c};${u.status==='avail'?'color:#000':''}">${s.t}</span>`+R('المساحة',u.area?u.area+' م² (تقريبية)':'غير محددة')+R('السعر',fm(u.price));
 if(u.status==='sold'){if(role==='view')h+=`<div class="note">معلومات الحاجز مخفية في وضع العرض.</div>`;
  else{const b=u.buyer;h+=`<div class="sec">معلومات الحاجز</div>`+R('الاسم',b.name)+R('الهاتف',`<bdi>${b.phone}</bdi>`)+R('رقم الهوية',`<bdi>${b.idn}</bdi>`)+R('تاريخ الحجز',`<bdi>${b.date}</bdi>`)+R('دفعة أولى',fz(b.p1))+R('دفعة ثانية',fz(b.p2))+R('دفعة ثالثة',fz(b.p3))+R('دفعة رابعة',fz(b.p4))+R('المبلغ المتبقي للتسديد',`<b>${fz(rem(u))}</b>`)+R('المسؤول',b.agent)}}
 if(canEdit(u))h+=`<button class="x pri" id="ed">${u.status!=='sold'&&role==='sales'?'تعديل / حجز':'تعديل'}</button>`;
 else if(role==='sales')h+=`<div class="note">هذا الحجز تابع لموظف آخر — للعرض فقط.</div>`;
 h+=`<button class="x" id="cl">إغلاق</button>`;open_(h);$('cl').onclick=close;if($('ed'))$('ed').onclick=()=>edit(id)}
function edit(id){const u=P[id],b=u.buyer||{name:'',phone:'',idn:'',date:new Date().toISOString().slice(0,10),p1:0,p2:0,p3:0,p4:0,agent:ME};
 let h=`<h2>تعديل — القطعة ${u.id}</h2>`;
 h+=`<label class="f">الحالة<select id="e_st">${Object.keys(ST).map(k=>`<option value="${k}" ${k===u.status?'selected':''}>${ST[k].t}</option>`).join('')}</select></label>`;
 if(role==='admin')h+=inp('e_area','المساحة (م²)',u.area,'number')+inp('e_price','السعر (د.ع)',u.price,'number');
 h+=`<div class="sec">بيانات الحاجز (تُحفظ إذا الحالة مباعة)</div>`+inp('b_name','الاسم الكامل',b.name)+inp('b_phone','الهاتف',b.phone)+inp('b_idn','رقم الهوية',b.idn)+inp('b_date','تاريخ الحجز',b.date,'date')+inp('b_p1','دفعة أولى (د.ع)',b.p1,'number')+inp('b_p2','دفعة ثانية (د.ع)',b.p2,'number')+inp('b_p3','دفعة ثالثة (د.ع)',b.p3,'number')+inp('b_p4','دفعة رابعة (د.ع)',b.p4,'number');
 h+=`<button class="x pri" id="sv">حفظ</button><button class="x" id="bk">رجوع</button>`;open_(h);$('bk').onclick=()=>show(id);
 $('sv').onclick=()=>{const v=i=>$(i).value,ch=[];const set=(o,k,x,l)=>{if(String(o[k])!==String(x)){ch.push(`${l}: ${o[k]} ← ${x}`);o[k]=x}};
  const ns=v('e_st');if(ns==='sold'&&!v('b_name').trim()){alert('اكتب اسم الحاجز');return}
  if(ns!==u.status){ch.push(`الحالة: ${ST[u.status].t} ← ${ST[ns].t}`);u.status=ns}
  if(role==='admin'){set(u,'area',+v('e_area'),'المساحة');set(u,'price',+v('e_price'),'السعر')}
  if(u.status==='sold'){if(!u.buyer)u.buyer={...b,agent:ME};set(u.buyer,'name',v('b_name'),'الاسم');set(u.buyer,'phone',v('b_phone'),'الهاتف');set(u.buyer,'idn',v('b_idn'),'الهوية');set(u.buyer,'date',v('b_date'),'التاريخ');set(u.buyer,'p1',+v('b_p1'),'دفعة أولى');set(u.buyer,'p2',+v('b_p2'),'دفعة ثانية');set(u.buyer,'p3',+v('b_p3'),'دفعة ثالثة');set(u.buyer,'p4',+v('b_p4'),'دفعة رابعة')}else u.buyer=null;
  if(ch.length)log.unshift({t:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),who:RL[role],unit:u.id,txt:ch.join(' | ')});
  paint();show(id)}}

const nz=s=>String(s==null?'':s).trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
const ALI={id:['رقم الوحدة','رقم القطعة','القطعة','الوحدة','id','unit','plot'],area:['المساحة','المساحة (م²)','area'],price:['السعر','السعر (د.ع)','الكلفة','price'],status:['الحالة','status'],name:['اسم الحاجز','الحاجز','الاسم','name','buyer'],phone:['الهاتف','رقم الهاتف','phone'],idn:['رقم الهوية','الهوية','idn'],date:['تاريخ الحجز','التاريخ','date'],p1:['دفعة أولى','الدفعة الأولى','المقدمة','p1'],p2:['دفعة ثانية','الدفعة الثانية','p2'],p3:['دفعة ثالثة','الدفعة الثالثة','p3'],p4:['دفعة رابعة','الدفعة الرابعة','p4'],agent:['المسؤول','الموظف','agent']};
const FN={id:'رقم الوحدة',area:'المساحة',price:'السعر',p1:'دفعة أولى',p2:'دفعة ثانية',p3:'دفعة ثالثة',p4:'دفعة رابعة'};
const toNum=v=>{if(typeof v==='number')return v;const s=String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g,'');return s===''?NaN:Number(s)};
const stOf=v=>{const s=nz(v);if(!s)return'';if(/غير مكتمل|build|قيد/.test(s))return'build';if(/مباع|sold|محجوز/.test(s))return'sold';if(/منجز|معروض|avail|جاهز/.test(s))return'avail';return null};
const dstr=v=>v instanceof Date?v.toISOString().slice(0,10):String(v==null?'':v).trim();
let pend=[];
function importUI(){
 if(role!=='admin'){open_(`<h2>رفع Excel</h2><div class="note">الاستيراد متاح للمدير فقط.</div><button class="x" id="cl">إغلاق</button>`);$('cl').onclick=close;return}
 open_(`<h2>رفع ملف Excel</h2><div class="note">يقرأ أول ورقة بالملف. الأعمدة المدعومة: رقم الوحدة (مطلوب)، المساحة، السعر، الحالة، اسم الحاجز، الهاتف، رقم الهوية، تاريخ الحجز، دفعة أولى/ثانية/ثالثة/رابعة، المسؤول. الخلايا الفارغة ما تغيّر البيانات الحالية. إذا انكتب اسم حاجز بدون حالة تصير الوحدة مباعة.</div><input type="file" id="xf" accept=".xlsx,.xls,.csv" style="width:100%;margin-top:10px"><div id="xr"></div><button class="x" id="cl">إغلاق</button>`);
 $('cl').onclick=close;
 $('xf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){$('xr').innerHTML='<div class="note">مكتبة قراءة Excel ما انحمّلت. تأكد من الإنترنت وأعد المحاولة.</div>';return}
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});parseXL(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))}
  catch(x){$('xr').innerHTML='<div class="note">تعذّرت قراءة الملف. تأكد إنه Excel أو CSV سليم.</div>'}}}
function parseXL(rows){
 const out=$('xr');pend=[];
 if(!rows.length){out.innerHTML='<div class="note">الورقة فارغة.</div>';return}
 const map={};Object.keys(rows[0]).forEach(k=>{for(const f in ALI)if(ALI[f].some(a=>nz(a)===nz(k)))map[f]=k});
 if(!map.id){out.innerHTML=`<div class="note">ما لگيت عمود "رقم الوحدة". الأعمدة الموجودة: ${Object.keys(rows[0]).join('، ')}</div>`;return}
 const err=[],seen=new Set();
 rows.forEach((r,i)=>{const L=i+2,g=f=>map[f]?r[map[f]]:'',id=toNum(g('id'));
  if(!P[id]){err.push(`سطر ${L}: رقم غير موجود (${g('id')})`);return}
  if(seen.has(id)){err.push(`سطر ${L}: القطعة ${id} مكررة`);return}
  seen.add(id);const nums={};let bad=false;
  ['area','price','p1','p2','p3','p4'].forEach(f=>{const v=g(f);if(String(v).trim()==='')return;const n=toNum(v);if(isNaN(n)||n<0){bad=true;err.push(`سطر ${L}: قيمة غير صحيحة في "${FN[f]}"`)}else nums[f]=n});
  if(bad)return;
  const name=String(g('name')).trim();let st=stOf(g('status'));
  if(st===null){err.push(`سطر ${L}: حالة غير معروفة (${g('status')})`);return}
  if(!st&&name)st='sold';
  if((st==='sold'||(!st&&P[id].status==='sold'))&&!name&&!P[id].buyer){err.push(`سطر ${L}: القطعة ${id} مباعة بدون اسم حاجز`);return}
  pend.push({id,nums,st,name,phone:String(g('phone')).trim(),idn:String(g('idn')).trim(),date:dstr(g('date')),agent:String(g('agent')).trim()})});
 out.innerHTML=R('الصفوف المقروءة',rows.length)+R('صالحة للتطبيق',pend.length)+R('فيها أخطاء',err.length)
  +(err.length?`<div class="note">${err.slice(0,8).join('<br>')}${err.length>8?`<br>و${err.length-8} أخطاء أخرى...`:''}</div>`:'')
  +(pend.length?`<button class="x pri" id="ap">تطبيق ${pend.length} وحدة</button>`:'');
 if($('ap'))$('ap').onclick=applyXL}
function applyXL(){
 pend.forEach(o=>{const u=P[o.id];['area','price'].forEach(f=>{if(o.nums[f]!==undefined)u[f]=o.nums[f]});
  if(o.st)u.status=o.st;
  if(u.status==='sold'){const b=u.buyer||{name:'',phone:'',idn:'',date:'',p1:0,p2:0,p3:0,p4:0,agent:'استيراد Excel'};
   if(o.name)b.name=o.name;if(o.phone)b.phone=o.phone;if(o.idn)b.idn=o.idn;if(o.date)b.date=o.date;if(o.agent)b.agent=o.agent;
   ['p1','p2','p3','p4'].forEach(f=>{if(o.nums[f]!==undefined)b[f]=o.nums[f]});u.buyer=b}else u.buyer=null});
 log.unshift({t:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),who:RL[role],unit:'—',txt:`استيراد من Excel: ${pend.length} وحدة`});
 const n=pend.length;pend=[];paint();open_(`<h2>تم الاستيراد</h2><div class="note">انطبقت بيانات ${n} وحدة على الخريطة.</div><button class="x" id="cl">إغلاق</button>`);$('cl').onclick=close}
function report(){
 if(role!=='admin'){open_(`<h2>التقرير</h2><div class="note">التقرير متاح للمدير فقط.</div><button class="x" id="cl">إغلاق</button>`);$('cl').onclick=close;return}
 const A=Object.values(P),of=s=>A.filter(u=>u.status===s),sold=of('sold'),av=of('avail'),bd=of('build');
 const sum=(a,f)=>a.reduce((s,u)=>s+f(u),0),sp=sum(sold,u=>u.price||0),rc=sum(sold,u=>pd_(u.buyer)),offp=sum(av,u=>u.price||0);
 open_(`<h2>تقرير الوحدات</h2>`+R('عدد الوحدات الكلي',A.length)+R('المنجزة والمباعة',sold.length)+R('المنجزة وغير المباعة (المعروضة)',av.length)+R('غير المكتملة',bd.length)
 +`<div class="sec">الجانب المالي</div>`+R('الكلفة الإجمالية للوحدات المعروضة',fz(offp))+R('الكلفة الإجمالية للوحدات المباعة',fz(sp))+R('مجموع المبالغ المستلمة (المدفوعات)',fz(rc))+R('مجموع المبالغ المستحقة التسديد',`<b>${fz(sp-rc)}</b>`)
 +`<div class="note">المتبقي = السعر − مجموع الدفعات الأربع. الأسعار غير المحددة تُحسب صفراً.</div><button class="x" id="cl">إغلاق</button>`);$('cl').onclick=close}
$('lgb').onclick=()=>{if(role!=='admin'){open_(`<h2>سجل التغييرات</h2><div class="note">السجل متاح للمدير فقط.</div><button class="x" id="cl">إغلاق</button>`)}
 else open_(`<h2>سجل التغييرات</h2>`+(log.length?log.map(l=>`<div class="lg"><b>القطعة ${l.unit}</b> — ${l.txt}<small>${l.who} · ${l.t}</small></div>`).join(''):'<div class="note">ما كو تعديلات لحد الآن.</div>')+`<button class="x" id="cl">إغلاق</button>`);$('cl').onclick=close};
function find(){const id=+$('q').value,u=P[id];if(!u){alert('رقم غير موجود');return}
 document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));u.el.classList.add('hl');
 const r=w0.getBoundingClientRect();vb.w=110;vb.x=u.cx-55;vb.y=u.cy-55*r.height/r.width;setvb();show(id)}
$('go').onclick=find;$('q').onkeydown=e=>{if(e.key==='Enter')find()};$('fit').onclick=fit;$('rep').onclick=report;$('imp').onclick=importUI;$('fs').onclick=()=>{const e=document.documentElement;e.requestFullscreen&&e.requestFullscreen()};
$('role').onchange=e=>{role=e.target.value;document.body.classList.toggle('view',role==='view');paint();fit()};$('ov').onclick=e=>{if(e.target.id==='ov')close()};
paint();fit();
</script></body></html>
